name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the "packageManager" field in package.json;
      # passing it here too makes pnpm/action-setup error on a version clash.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # End to end, with no secrets: these scenarios are rejected at the
      # identity gate, so they need no wallet, no funds and no facilitator.
      - run: pnpm demo:missing-identity
      - run: pnpm demo:mismatched-identity
      - run: pnpm demo:expired-identity
