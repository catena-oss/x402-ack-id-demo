version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # The @x402/* pins are exact on purpose: they move together and every
    # bump is checked against the payment tests by hand.
    ignore:
      - dependency-name: "@x402/*"
      # Types track the runtime major; Node is pinned to 22 here.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
